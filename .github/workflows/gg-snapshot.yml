name: gg-snapshot
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Golf Genius data via the Apps Script proxy
        env:
          GAS: https://script.google.com/macros/s/AKfycbzv1eGhaOCn-Yb_zdtfeVFfDQMCfO_rFp7UJ_NU6xdVNXOuJoalxAHLGn150jFSFoYVHQ/exec
          LEAGUE: '12929960899258629360'
          PAGE: '12929960991667535072'
          PORTAL: '12929960966904364298'
        run: |
          set -x
          mkdir -p gg-snapshot
          curl -sSL "$GAS?action=gg-resolve&league=$LEAGUE&page=$PAGE&exclude=$LEAGUE,$PAGE,$PORTAL" -o gg-snapshot/resolve.json
          cat gg-snapshot/resolve.json; echo
          TID=$(jq -r '.tournamentId // empty' gg-snapshot/resolve.json)
          echo "TID=$TID"
          if [ -n "$TID" ]; then
            curl -sSL "$GAS?action=gg-schedule&id=$TID" -o gg-snapshot/schedule.json
            curl -sSL "$GAS?action=gg-html&id=$TID" -o gg-snapshot/results.html
            curl -sSL "$GAS?action=gg&id=$TID" -o gg-snapshot/results.json
            wc -c gg-snapshot/*
          fi
          curl -sSL -A 'Mozilla/5.0' "https://www.golfgenius.com/websites/$PORTAL" -o gg-snapshot/portal.html || true
          curl -sSL -A 'Mozilla/5.0' "https://www.golfgenius.com/pages/$PAGE" -o gg-snapshot/results-page.html || true
          wc -c gg-snapshot/*
      - name: Commit snapshot to this branch
        run: |
          git config user.name "gg-snapshot"
          git config user.email "gg-snapshot@users.noreply.github.com"
          git add gg-snapshot
          git commit -m "gg-snapshot: raw Golf Genius data (temporary)" || echo "nothing to commit"
          git push origin HEAD:${GITHUB_REF_NAME}
