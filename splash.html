<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>The Pheasant Invitational</title>
  <meta name="theme-color" content="#0e2415">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    html, body { height: 100%; margin: 0; background: #0e2415; }
    #splash {
      position: fixed; inset: 0;
      background: #0e2415;                 /* brand backdrop = the color it fades to */
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Full video, whole copper plate intact, with a small margin on the sides so
       it reads as a framed launch card rather than a cropped/letterboxed frame. */
    #splashVid {
      width: 92%;
      height: auto;
      max-height: 94%;
      display: block;
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.55), 0 0 0 1px rgba(198,160,90,0.18);
      transition: opacity 650ms ease;
    }
    #splash.done #splashVid { opacity: 0; }   /* fades to the #0e2415 backdrop */
  </style>
</head>
<body>
  <div id="splash">
    <video id="splashVid" src="pheasant-splash.mp4?v=3" muted playsinline autoplay preload="auto"></video>
  </div>

  <script>
    (function () {
      var NEXT = 'schedule.html';
      var KEY  = 'pheasantSplashSeen';

      function goNext() { window.location.replace(NEXT); }

      // ?replay (or ?force) always plays — handy for testing; doesn't touch
      // the daily gate.
      var force = /[?&](replay|force)/i.test(location.search);

      // Event-week only: outside the tournament window, the app opens to the
      // homepage instead of the splash. (Matches app.js TOURNAMENT_NAV dates.)
      var EVENT_START = new Date('2026-08-11T00:00:00Z');
      var EVENT_END   = new Date('2026-12-31T23:59:59Z');
      var now = new Date();
      if (!force && (now < EVENT_START || now > EVENT_END)) {
        window.location.replace('index.html');
        return;
      }

      // Once per day: if already shown today, skip straight to Schedule.
      var d = new Date();
      var today = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
      if (!force) {
        var seen;
        try { seen = localStorage.getItem(KEY); } catch (e) {}
        if (seen === today) { goNext(); return; }
        try { localStorage.setItem(KEY, today); } catch (e) {}
      }

      var v = document.getElementById('splashVid');
      var went = false;
      function finish() {
        if (went) return; went = true;
        // Tell the Schedule page to fade in from the same color.
        try { sessionStorage.setItem('pheasantFade', '1'); } catch (e) {}
        document.getElementById('splash').classList.add('done');  // fade video → backdrop
        setTimeout(goNext, 600);                                  // then navigate
      }

      v.addEventListener('ended', finish);
      v.addEventListener('error', finish);
      // Safety net: never trap the user if the video stalls.
      setTimeout(finish, 14000);

      var p = v.play();
      if (p && p.catch) p.catch(function () { finish(); });  // autoplay blocked → still hand off gracefully
    })();
  </script>
</body>
</html>
